<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, system-ui, sans-serif">
  <title>ALARMM approach</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717a"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- Pillars -->
  <text x="40" y="38" font-size="13" font-weight="600" fill="#71717a" letter-spacing="1.5">RESEARCH PILLARS</text>
  <g font-size="15" fill="#18181b">
    <rect x="40" y="56" width="270" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="58" y="85" font-weight="600">Digital-twin alignment</text>
    <text x="58" y="107" font-size="12.5" fill="#52525b">Map anchored to 3D scans / CAD</text>

    <rect x="40" y="142" width="270" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="58" y="171" font-weight="600">Semantic reasoning</text>
    <text x="58" y="193" font-size="12.5" fill="#52525b">Scene understanding, VLMs / LLMs</text>

    <rect x="40" y="228" width="270" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="58" y="257" font-weight="600">Dynamic scene awareness</text>
    <text x="58" y="279" font-size="12.5" fill="#52525b">Filter moving objects and noise</text>

    <rect x="40" y="314" width="270" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="58" y="343" font-weight="600">AI-enhanced IMU</text>
    <text x="58" y="365" font-size="12.5" fill="#52525b">Learned inertial positioning</text>
  </g>

  <!-- Arrows into core -->
  <g stroke="#71717a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M310 91 C 350 91, 350 190, 384 205"/>
    <path d="M310 177 C 345 177, 350 200, 384 212"/>
    <path d="M310 263 C 345 263, 350 225, 384 220"/>
    <path d="M310 349 C 350 349, 350 235, 384 228"/>
  </g>

  <!-- Core -->
  <rect x="388" y="150" width="210" height="130" rx="14" fill="#18181b"/>
  <text x="493" y="196" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">SLAM core</text>
  <text x="493" y="220" font-size="12.5" fill="#d4d4d8" text-anchor="middle">stella_vSLAM (modular)</text>
  <text x="493" y="242" font-size="12.5" fill="#d4d4d8" text-anchor="middle">bundle adjustment</text>
  <text x="493" y="260" font-size="12.5" fill="#d4d4d8" text-anchor="middle">+ new constraints</text>

  <!-- Output -->
  <path d="M598 215 L 652 215" stroke="#71717a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="656" y="160" width="264" height="110" rx="14" fill="#2563eb"/>
  <text x="788" y="200" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">~1 cm</text>
  <text x="788" y="224" font-size="13" fill="#dbeafe" text-anchor="middle">markerless localisation</text>
  <text x="788" y="244" font-size="13" fill="#dbeafe" text-anchor="middle">over 600 m²+ shop floors</text>

  <!-- Use cases -->
  <text x="656" y="318" font-size="13" font-weight="600" fill="#71717a" letter-spacing="1.5">USE CASES</text>
  <g font-size="13.5" fill="#18181b">
    <circle cx="664" cy="342" r="3.5" fill="#2563eb"/>
    <text x="676" y="347">AR guidance for operators</text>
    <circle cx="664" cy="368" r="3.5" fill="#2563eb"/>
    <text x="676" y="373">AMR / AGV / forklift localisation</text>
  </g>
</svg>
