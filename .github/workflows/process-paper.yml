name: Process Paper from Inbox

on:
  push:
    branches: [main]
    paths:
      - 'inbox/papers/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          lfs: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Find PDFs in inbox
        id: find
        run: |
          FILES=$(find inbox/papers -maxdepth 1 -type f -iname '*.pdf' | sort)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found: $FILES"

      - name: Process each PDF with Groq
        if: steps.find.outputs.files != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          failed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Processing $file..."
            if node scripts/process-paper.mjs "$file"; then
              # The PDF now lives in public/papers/ — don't keep a second copy in the inbox
              git rm -q "$file"
            else
              echo "::error::Failed to process $file — leaving it in inbox/papers/ for the next run."
              failed=1
            fi
          done <<< "${{ steps.find.outputs.files }}"
          exit $failed

      - name: Commit generated content
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/papers/ public/papers/ inbox/papers/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nothing changed."
          else
            git commit -m "auto: process paper from inbox"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
